name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: uv sync, Ruff, manage.py check, pytest, OpenAPI provenance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: uv sync (locked environment)
        run: uv sync --frozen

      - name: Dependency audit
        run: uv run --with pip-audit pip-audit

      - name: Secret scan
        run: uvx --from detect-secrets==1.5.0 detect-secrets scan --baseline .secrets.baseline --exclude-files '\.secrets\.baseline$'

      - name: Ruff
        run: uv run ruff check .

      - name: Django system check
        run: uv run python manage.py check

      - name: Full test suite (SQLite in-memory, test settings)
        run: uv run pytest

      - name: OpenAPI access and contract fixture tests
        run: |
          uv run pytest tests/test_public_openapi.py tests/test_admin_openapi.py
          uv run pytest tests/test_contract_fixtures.py tests/test_openapi_hash_drift.py

      - name: OpenAPI export hash matches accepted provenance
        run: uv run python scripts/verify_openapi_export.py
